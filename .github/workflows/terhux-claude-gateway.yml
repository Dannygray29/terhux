name: Terhux Claude Request Gateway

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  encrypt-and-queue:
    if: startsWith(github.event.issue.title, '[Claude-Terhux]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout certificate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate and encrypt request
        env:
          TERHUX_PIN: ${{ secrets.TERHUX_PIN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail

          test -n "${TERHUX_PIN:-}" || { echo "TERHUX_PIN secret is not configured"; exit 1; }
          test -f terhux-access-cert.pem || { echo "Terhux public certificate is not published yet"; exit 1; }

          python3 - <<'PY' > request.json
          import json, os, sys
          body = os.environ.get("ISSUE_BODY", "")
          try:
              data = json.loads(body)
          except Exception:
              print("Issue body must be a JSON object.", file=sys.stderr)
              raise SystemExit(2)
          if not isinstance(data, dict):
              raise SystemExit("Request must be a JSON object.")
          allowed = {
              "ID","ACTION","PROJECT","PATH","CONTENT_B64",
              "FROM_B64","TO_B64","PACKAGE","NEW_NAME","APPROVED"
          }
          if set(data) - allowed:
              raise SystemExit("Unsupported request field.")
          for k,v in data.items():
              if not isinstance(v, str) or any(c in v for c in "\r\n\x00"):
                  raise SystemExit("All request values must be single-line strings.")
          import re
          if not re.fullmatch(r"[A-Za-z0-9._-]{1,80}", data.get("ID","")):
              raise SystemExit("Invalid ID.")
          if not data.get("ACTION"):
              raise SystemExit("ACTION is required.")
          if data.get("APPROVED") != "true":
              raise SystemExit("APPROVED=true is required.")
          print(json.dumps(data, separators=(",",":")))
          PY

          cleartext="$(python3 - <<'PY'
          import json, os
          fields=json.load(open("request.json"))
          pin=os.environ["TERHUX_PIN"]
          print(json.dumps({
              "protocol":"TERHUX_ISSUE_V1",
              "pin":pin,
              "fields":fields
          }, separators=(",",":")))
          PY
          )"

          printf '%s' "$cleartext" |
            openssl cms -encrypt -binary -aes-256-gcm               -in /dev/stdin -outform DER terhux-access-cert.pem               > encrypted.der

          {
            printf '%s\n' 'TERHUX_CMS_V1'
            printf 'PAYLOAD_B64=%s\n' "$(base64 -w0 encrypted.der)"
          } > encrypted-body.txt

          rm -f request.json encrypted.der

      - name: Replace issue body and queue for phone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE_NUMBER"             --repo "$GITHUB_REPOSITORY"             --body-file encrypted-body.txt             --add-label terhux-request
