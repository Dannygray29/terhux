name: Build GREY Chrome Bridge APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'grey-chrome-bridge/android-app/**'
      - '.github/workflows/grey-chrome-bridge-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${ANDROID_HOME}" --licenses
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${ANDROID_HOME}" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: grey-chrome-bridge/android-app
        run: gradle --no-daemon assembleDebug
      - name: Publish APK to bridge branch
        run: |
          mkdir -p grey-chrome-bridge/releases
          cp grey-chrome-bridge/android-app/app/build/outputs/apk/debug/app-debug.apk grey-chrome-bridge/releases/grey-chrome-bridge-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grey-chrome-bridge/releases/grey-chrome-bridge-debug.apk
          if git diff --cached --quiet; then
            echo "APK is unchanged; no commit needed."
          else
            git commit -m "Build GREY Chrome Bridge debug APK"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
