name: Build GREY Browser APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'grey-chrome-bridge/grey-browser/**'
      - '.github/workflows/grey-browser-android.yml'
  push:
    paths:
      - 'grey-chrome-bridge/grey-browser/**'
      - '.github/workflows/grey-browser-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${ANDROID_HOME}" --licenses
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${ANDROID_HOME}" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build GREY Browser debug APK
        working-directory: grey-chrome-bridge/grey-browser
        run: gradle --no-daemon assembleDebug
      - name: Publish APK to dedicated download branch
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/grey-browser-download
          cp grey-chrome-bridge/grey-browser/app/build/outputs/apk/debug/app-debug.apk /tmp/grey-browser-download/GREY-Browser-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan builds/grey-browser-apk
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p downloads
          cp /tmp/grey-browser-download/GREY-Browser-debug.apk downloads/GREY-Browser-debug.apk
          printf '%s\n' "GREY Browser debug APK built from commit ${GITHUB_SHA}." > downloads/README.txt
          git add downloads
          git commit -m "Publish GREY Browser debug APK"
          git push origin HEAD:refs/heads/builds/grey-browser-apk --force
