name: Build GREY Browser APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'grey-chrome-bridge/grey-browser/**'
      - '.github/workflows/grey-browser-android.yml'
  push:
    paths:
      - 'grey-chrome-bridge/grey-browser/**'
      - '.github/workflows/grey-browser-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${ANDROID_HOME}" --licenses
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${ANDROID_HOME}" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build GREY Browser debug APK
        working-directory: grey-chrome-bridge/grey-browser
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: grey-browser-debug-apk
          path: grey-chrome-bridge/grey-browser/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
