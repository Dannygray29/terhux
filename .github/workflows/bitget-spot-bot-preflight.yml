name: Bitget Spot Bot preflight (read-only)

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Spot market in CCXT format (e.g. BTC/USDT)"
        required: true
        type: string
        default: "BTC/USDT"

permissions:
  contents: read

concurrency:
  group: bitget-spot-bot-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exchange client
        run: python -m pip install --disable-pip-version-check "ccxt==4.4.99"
      - name: Validate account and spot constraints (NO ORDERS)
        env:
          BITGET_SPOT_API_KEY: ${{ secrets.BITGET_SPOT_API_KEY }}
          BITGET_SPOT_API_SECRET: ${{ secrets.BITGET_SPOT_API_SECRET }}
          BITGET_SPOT_API_PASSPHRASE: ${{ secrets.BITGET_SPOT_API_PASSPHRASE }}
          BITGET_SPOT_SYMBOL: ${{ inputs.symbol }}
          START_BALANCE_USDT: "1.44"
          NET_PROFIT_TARGET_USDT: "0.05"
        run: python projects/bitget-spot-bot/live_spot_preflight.py
